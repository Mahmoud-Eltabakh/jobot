services:
  jobot:
    build:
      context: .
      dockerfile: Dockerfile
    image: jobot:latest
    pull_policy: build
    container_name: jobot-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - JOBOT_ENV=production
      - JOBOT_LOG_LEVEL=INFO
      - JOBOT_DATA_DIR=/app/data
      - JOBOT_AI_PROVIDER=ollama
      - JOBOT_OLLAMA_BASE_URL=http://host.docker.internal:11434
      - JOBOT_OLLAMA_MODEL=llama3.1:8b
      - JOBOT_OLLAMA_EMBED_MODEL=nomic-embed-text
    volumes:
      - jobot_data:/app/data

volumes:
  jobot_data:
    driver: local
