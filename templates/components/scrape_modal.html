<!-- Scrape Discovery Mode Modal Popup -->
<div id="scrape-modal-backdrop" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-sm animate-fade-in">
    <div class="bg-slate-900 border border-slate-800 rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-5">
        <!-- Modal Header -->
        <div class="flex items-center justify-between border-b border-slate-800 pb-4">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-emerald-600/20 border border-emerald-500/40 flex items-center justify-center text-emerald-400">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                </div>
                <div>
                    <h3 class="text-base font-bold text-white">Start Job Scraping Discovery</h3>
                    <p class="text-xs text-slate-400">Customize locations, work type, and target platforms:</p>
                </div>
            </div>
            <button type="button" onclick="document.getElementById('modal-container').innerHTML = ''" class="text-slate-500 hover:text-slate-300 transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>

        <!-- Search Parameters Form (Read from UI Profile & Configurable) -->
        <form id="scrape-modal-params-form" class="space-y-3">
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 bg-slate-950/70 p-3.5 rounded-xl border border-slate-800 text-xs">
                <div>
                    <label class="block text-slate-400 font-medium mb-1 flex items-center justify-between">
                        <span>Target Location(s)</span>
                        <span class="text-[10px] text-emerald-400 font-mono">From Profile</span>
                    </label>
                    <input type="text" name="target_locations" value="{{ target_locations_str }}" 
                           placeholder="e.g. Remote, Germany, Berlin" 
                           class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-slate-200 focus:border-emerald-500 font-medium text-xs">
                </div>
                <div>
                    <label class="block text-slate-400 font-medium mb-1 flex items-center justify-between">
                        <span>Work Type / Model</span>
                        <span class="text-[10px] text-sky-400 font-mono">From Profile</span>
                    </label>
                    <select name="work_preference" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-slate-200 focus:border-emerald-500 font-medium text-xs">
                        <option value="remote_first" {% if work_preference == 'remote_first' %}selected{% endif %}>Remote First (Preferred)</option>
                        <option value="remote_only" {% if work_preference == 'remote_only' %}selected{% endif %}>Remote Only</option>
                        <option value="hybrid" {% if work_preference == 'hybrid' %}selected{% endif %}>Hybrid</option>
                        <option value="onsite" {% if work_preference == 'onsite' %}selected{% endif %}>On-site</option>
                        <option value="any" {% if work_preference == 'any' %}selected{% endif %}>Any Work Model</option>
                    </select>
                </div>
            </div>

            <!-- Target Platforms Selection -->
            <div class="bg-slate-950/70 p-3.5 rounded-xl border border-slate-800 text-xs space-y-2">
                <div class="flex items-center justify-between">
                    <label class="font-medium text-slate-300">Target Platforms (Parallel Scraping)</label>
                    <div class="space-x-2 text-[10px]">
                        <button type="button" onclick="document.querySelectorAll('.platform-cb').forEach(c => c.checked = true)" class="text-sky-400 hover:underline">Select All</button>
                        <span class="text-slate-600">|</span>
                        <button type="button" onclick="document.querySelectorAll('.platform-cb').forEach(c => c.checked = false)" class="text-slate-400 hover:underline">Clear</button>
                    </div>
                </div>

                <div class="grid grid-cols-2 sm:grid-cols-3 gap-2 pt-1">
                    <label class="flex items-center space-x-2 p-2 rounded-lg bg-slate-900 border border-slate-800 cursor-pointer hover:border-slate-700 transition">
                        <input type="checkbox" name="platforms" value="linkedin" checked class="platform-cb rounded bg-slate-950 border-slate-700 text-emerald-500 focus:ring-0">
                        <span class="text-slate-200 font-medium">LinkedIn</span>
                    </label>
                    <label class="flex items-center space-x-2 p-2 rounded-lg bg-slate-900 border border-slate-800 cursor-pointer hover:border-slate-700 transition">
                        <input type="checkbox" name="platforms" value="google" checked class="platform-cb rounded bg-slate-950 border-slate-700 text-emerald-500 focus:ring-0">
                        <span class="text-slate-200 font-medium">Google Jobs</span>
                    </label>
                    <label class="flex items-center space-x-2 p-2 rounded-lg bg-slate-900 border border-slate-800 cursor-pointer hover:border-slate-700 transition">
                        <input type="checkbox" name="platforms" value="stepstone" checked class="platform-cb rounded bg-slate-950 border-slate-700 text-emerald-500 focus:ring-0">
                        <span class="text-slate-200 font-medium">StepStone</span>
                    </label>
                    <label class="flex items-center space-x-2 p-2 rounded-lg bg-slate-900 border border-slate-800 cursor-pointer hover:border-slate-700 transition">
                        <input type="checkbox" name="platforms" value="indeed" class="platform-cb rounded bg-slate-950 border-slate-700 text-emerald-500 focus:ring-0">
                        <span class="text-slate-200 font-medium">Indeed</span>
                    </label>
                    <label class="flex items-center space-x-2 p-2 rounded-lg bg-slate-900 border border-slate-800 cursor-pointer hover:border-slate-700 transition">
                        <input type="checkbox" name="platforms" value="glassdoor" class="platform-cb rounded bg-slate-950 border-slate-700 text-emerald-500 focus:ring-0">
                        <span class="text-slate-200 font-medium">Glassdoor</span>
                    </label>
                    <label class="flex items-center space-x-2 p-2 rounded-lg bg-slate-900 border border-slate-800 cursor-pointer hover:border-slate-700 transition">
                        <input type="checkbox" name="platforms" value="zip_recruiter" class="platform-cb rounded bg-slate-950 border-slate-700 text-emerald-500 focus:ring-0">
                        <span class="text-slate-200 font-medium">ZipRecruiter</span>
                    </label>
                </div>

                <div class="pt-1">
                    <input type="text" name="custom_platforms" placeholder="Additional custom platforms (comma-separated)..."
                           class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2 text-slate-200 font-mono text-[11px] focus:border-emerald-500">
                </div>
            </div>
        </form>

        <!-- Options Choice Cards -->
        <div class="space-y-3 text-xs">
            <!-- Option 1: Fresh Start (Delete 'New Matches' & Re-Scrape) -->
            <button hx-post="/web/scrape/run?mode=fresh" 
                    hx-include="#scrape-modal-params-form"
                    hx-target="#modal-container" 
                    hx-swap="innerHTML"
                    class="w-full text-left p-4 rounded-xl border border-rose-900/60 bg-rose-950/20 hover:bg-rose-950/50 hover:border-rose-700 transition space-y-1 group active:scale-98">
                <div class="flex items-center justify-between">
                    <div class="font-bold text-rose-300 flex items-center space-x-1.5">
                        <svg class="w-4 h-4 text-rose-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                        <span>Start Fresh (Clear NEW & Scrape)</span>
                    </div>
                    <span class="text-[10px] px-2 py-0.5 rounded bg-rose-950 border border-rose-800 text-rose-300 font-mono">Reset NEW</span>
                </div>
                <p class="text-[11px] text-slate-400 group-hover:text-slate-300 transition leading-relaxed">
                    Deletes current jobs in <strong>NEW</strong> stage and scrapes selected job boards with specified locations and work types in parallel.
                </p>
            </button>

            <!-- Option 2: Search More (Incremental Search) -->
            <button hx-post="/web/scrape/run?mode=incremental" 
                    hx-include="#scrape-modal-params-form"
                    hx-target="#modal-container" 
                    hx-swap="innerHTML"
                    class="w-full text-left p-4 rounded-xl border border-indigo-900/60 bg-indigo-950/20 hover:bg-indigo-950/50 hover:border-indigo-700 transition space-y-1 group active:scale-98">
                <div class="flex items-center justify-between">
                    <div class="font-bold text-indigo-300 flex items-center space-x-1.5">
                        <svg class="w-4 h-4 text-indigo-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
                        <span>Search More Jobs (Keep Existing Matches)</span>
                    </div>
                    <span class="text-[10px] px-2 py-0.5 rounded bg-indigo-950 border border-indigo-800 text-indigo-300 font-mono">Incremental</span>
                </div>
                <p class="text-[11px] text-slate-400 group-hover:text-slate-300 transition leading-relaxed">
                    Keeps all existing matches and runs parallel multi-source discovery across selected platforms.
                </p>
            </button>
        </div>

        <!-- Modal Footer -->
        <div class="flex items-center justify-end border-t border-slate-800 pt-3">
            <button type="button" onclick="document.getElementById('modal-container').innerHTML = ''" class="px-4 py-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300 font-medium text-xs transition">
                Cancel
            </button>
        </div>
    </div>
</div>
