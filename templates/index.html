{% extends "base.html" %}

{% block content %}
<div class="flex flex-col space-y-4 flex-1">
    <!-- Filter Bar Component Container -->
    <div id="filter-bar-container" hx-get="/web/components/filter-bar" hx-trigger="load">
        <!-- Filter bar partial loads here -->
    </div>

    <!-- Active View Container (Kanban / Table / Settings) -->
    <div id="view-container" class="flex-1 flex flex-col min-h-0" hx-get="/web/views/kanban" hx-trigger="load">
        <!-- Default Kanban view loads here -->
        <div class="flex items-center justify-center p-12 text-slate-500 text-sm">
            <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-emerald-500" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Loading dashboard...
        </div>
    </div>
</div>
{% endblock %}
