<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ app_name }} — AI Job Search & Application Tracker</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        slate: {
                            850: '#151f32',
                            950: '#0a0f1d',
                        }
                    }
                }
            }
        }
    </script>
    <!-- HTMX -->
    <script src="https://unpkg.com/htmx.org@1.9.12"></script>
    <style>
        @media (max-width: 639px) {
            header > div { height: auto !important; flex-wrap: wrap; gap: 8px; padding-top: 8px; padding-bottom: 8px; }
            header nav { width: 100%; order: 3; }
            header nav .nav-tab { flex: 1; min-width: 0; padding: 6px 3px; flex-direction: column; gap: 2px; margin: 0; }
            header nav .nav-tab span { font-size: 10px; margin: 0; }
            header > div > div:last-child { flex-wrap: wrap; gap: 4px; min-width: 0; }
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #0f172a;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 3px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #475569;
        }
    </style>
</head>
<body data-page="{{ active_page or '' }}" class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans antialiased">
    <!-- Top Navigation Bar -->
    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <!-- Brand Logo -->
            <div class="flex items-center space-x-3">
                <div class="w-9 h-9 rounded-lg bg-gradient-to-tr from-emerald-500 to-indigo-600 flex items-center justify-center font-bold text-white shadow-lg shadow-emerald-500/20">
                    JB
                </div>
                <div>
                    <span class="font-bold text-lg tracking-tight bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">{{ app_name }}</span>
                </div>
            </div>

            <!-- View Navigation Switcher -->
            <nav class="flex items-center bg-slate-950 p-1 rounded-xl border border-slate-800 space-x-1">
                <a href="/dashboard" {% if active_page == 'dashboard' %}aria-current="page"{% endif %}
                    class="nav-tab px-3.5 py-1.5 rounded-lg text-xs font-medium transition flex items-center space-x-1.5 {% if active_page == 'dashboard' %}bg-slate-800 text-white shadow-sm{% else %}text-slate-300 hover:text-white hover:bg-slate-800/60{% endif %}">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17V7m0 10a2 2 0 01-2 2H5a2 2 0 01-2-2V7a2 2 0 012-2h2a2 2 0 012 2m0 10a2 2 0 002 2h2a2 2 0 002-2M9 7a2 2 0 012-2h2a2 2 0 012 2m0 10V7m0 10a2 2 0 002 2h2a2 2 0 002-2V7a2 2 0 00-2-2h-2a2 2 0 00-2 2"></path></svg>
                    <span>Kanban</span>
                </a>
                <a href="/jobs/board" {% if active_page == 'jobs-board' %}aria-current="page"{% endif %}
                   class="nav-tab px-3.5 py-1.5 rounded-lg text-xs font-medium transition {% if active_page == 'jobs-board' %}bg-slate-800 text-white shadow-sm{% else %}text-slate-300 hover:text-white hover:bg-slate-800/60{% endif %}">Board</a>
                <a href="/jobs/table" {% if active_page == 'jobs-table' %}aria-current="page"{% endif %}
                    class="nav-tab px-3.5 py-1.5 rounded-lg text-xs font-medium transition flex items-center space-x-1.5 {% if active_page == 'jobs-table' %}bg-slate-800 text-white shadow-sm{% else %}text-slate-300 hover:text-white hover:bg-slate-800/60{% endif %}">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M3 14h18m-9-4v8m-7 0h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z"></path></svg>
                    <span>Table View</span>
                </a>
                <a href="/queue" {% if active_page == 'queue' %}aria-current="page"{% endif %}
                    class="nav-tab px-3.5 py-1.5 rounded-lg text-xs font-medium transition flex items-center space-x-1.5 {% if active_page == 'queue' %}bg-slate-800 text-white shadow-sm{% else %}text-slate-300 hover:text-white hover:bg-slate-800/60{% endif %}">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                    <span>AI Queue</span>
                </a>
                <a href="/profile" {% if active_page == 'profile' %}aria-current="page"{% endif %}
                    class="nav-tab px-3.5 py-1.5 rounded-lg text-xs font-medium transition flex items-center space-x-1.5 {% if active_page == 'profile' %}bg-slate-800 text-white shadow-sm{% else %}text-slate-300 hover:text-white hover:bg-slate-800/60{% endif %}">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
                    <span>Profile</span>
                </a>
                <a href="/settings" {% if active_page == 'settings' %}aria-current="page"{% endif %}
                    class="nav-tab px-3.5 py-1.5 rounded-lg text-xs font-medium transition flex items-center space-x-1.5 {% if active_page == 'settings' %}bg-slate-800 text-white shadow-sm{% else %}text-slate-300 hover:text-white hover:bg-slate-800/60{% endif %}">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                    <span>Settings</span>
                </a>
            </nav>

            <!-- Action Controls & Status Indicator -->
            <div class="flex items-center space-x-3">
                <!-- Live Task Queue Poller -->
                <div hx-get="/web/components/queue-status" hx-trigger="load, every 4s" hx-swap="outerHTML">
                    <div class="flex items-center space-x-1.5 px-2.5 py-1 rounded-lg bg-slate-900 border border-slate-800 text-xs font-mono text-slate-400">
                        <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
                        <span>Queue: Idle</span>
                    </div>
                </div>

                <button 
                    hx-get="/web/components/scrape-modal" 
                    hx-target="#modal-container"
                    hx-swap="innerHTML"
                    class="px-3.5 py-1.5 rounded-lg text-xs font-semibold bg-emerald-600 hover:bg-emerald-500 text-white shadow-md shadow-emerald-600/20 active:scale-95 transition flex items-center space-x-1.5">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    <span>Scrape Now</span>
                </button>

                {% if current_user %}
                <div class="flex items-center space-x-2 border-l border-slate-800 pl-3">
                    <span class="text-xs font-medium text-slate-300" title="{{ current_user.email }}">{{ current_user.full_name or current_user.email }}</span>
                    <a href="/logout" class="px-2.5 py-1 rounded-lg text-xs text-slate-400 hover:text-white hover:bg-slate-800/80 transition">
                        Logout
                    </a>
                </div>
                {% else %}
                <div class="flex items-center space-x-1 border-l border-slate-800 pl-3">
                    <a href="/login" class="px-2.5 py-1 rounded-lg text-xs text-slate-300 hover:text-white hover:bg-slate-800/80 transition">
                        Sign In
                    </a>
                </div>
                {% endif %}
            </div>
        </div>
    </header>

    <!-- Main Content Body -->
    <main class="flex-1 flex flex-col max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-4">
        {% if current_user %}
        <div id="system-alerts" aria-live="polite" hx-get="/web/components/system-alerts"
             hx-trigger="load, every 15s, refreshView from:body" hx-swap="innerHTML" hx-sync="this:replace"></div>
        {% endif %}
        {% block content %}{% endblock %}
    </main>

    <div id="popup-notifications" aria-live="polite" aria-atomic="true" class="fixed bottom-5 right-5 z-50 flex w-[min(24rem,calc(100vw-2rem))] flex-col gap-2"></div>

    <!-- Modal Container for Scrape Popup -->
    <div id="modal-container"></div>

    <!-- Slide-Over Drawer Container for Job Inspector -->
    <div id="inspector-drawer"></div>

    <script>
        function jobotShowPopup(message, level) {
            if (!message) { return; }
            const tones = {
                error: 'border-rose-700 bg-rose-950 text-rose-100',
                warning: 'border-amber-700 bg-amber-950 text-amber-100',
                success: 'border-emerald-700 bg-emerald-950 text-emerald-100'
            };
            const popup = document.createElement('button');
            popup.type = 'button';
            popup.className = 'w-full border rounded-lg px-4 py-3 text-left text-sm shadow-xl transition ' + (tones[level] || tones.success);
            popup.textContent = message;
            popup.addEventListener('click', () => popup.remove());
            document.getElementById('popup-notifications').appendChild(popup);
            window.setTimeout(() => popup.remove(), 6000);
        }
        function jobotShowPendingPopups(root) {
            (root || document).querySelectorAll('[data-popup-message]').forEach((message) => {
                jobotShowPopup(message.textContent.trim(), message.dataset.popupLevel);
                message.remove();
            });
        }
        document.addEventListener('DOMContentLoaded', () => jobotShowPendingPopups(document));
        document.body.addEventListener('feedbackWarning', function(event) {
            jobotShowPopup(event.detail.value || '', 'warning');
        });
        document.body.addEventListener('htmx:afterSettle', function(event) {
            jobotShowPendingPopups(document);
        });
        document.body.addEventListener('htmx:responseError', function() {
            jobotShowPopup('Request failed. Please review your settings and try again.', 'error');
        });
        document.body.addEventListener('htmx:beforeSwap', function(event) {
            const response = event.detail.xhr;
            const path = event.detail.requestConfig?.path || '';
            const isProfileOperation = path.startsWith('/web/profile/') || path === '/api/settings/upload-cv';
            const isSettingsRescore = path === '/api/settings/rescore-all' &&
                event.detail.target?.id === 'scales-save-feedback';
            if ((isProfileOperation || isSettingsRescore) && [422, 502, 503].includes(response.status) &&
                (response.getResponseHeader('Content-Type') || '').includes('text/html')) {
                event.detail.shouldSwap = true;
                event.detail.isError = false;
            }
        });
        function switchTab(btn) {
            document.querySelectorAll('.nav-tab').forEach(el => {
                el.classList.remove('bg-slate-800', 'text-white', 'shadow-sm');
                el.classList.add('text-slate-300');
            });
            btn.classList.add('bg-slate-800', 'text-white', 'shadow-sm');
            btn.classList.remove('text-slate-300');
        }
    </script>
</body>
</html>
