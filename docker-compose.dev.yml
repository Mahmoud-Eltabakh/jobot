services:
  jobot:
    build:
      context: .
      dockerfile: Dockerfile.dev
    pull_policy: build
    container_name: jobot-app-dev
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Bind mount project source code for hot reload
      - .:/app
      # Separate volume for persistent data (database & chroma)
      - jobot_dev_data:/app/data
    environment:
      - APP_NAME=Jobot
      - ENV=development
      - DEBUG=true
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=sqlite:///data/jobot.db
      - CHROMA_DIR=data/chroma
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.1:8b
      - OLLAMA_EMBED_MODEL=nomic-embed-text
    depends_on:
      - ollama
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: jobot-ollama-dev
    ports:
      - "11434:11434"
    volumes:
      - ollama_dev_data:/root/.ollama
    restart: unless-stopped

volumes:
  jobot_dev_data:
  ollama_dev_data:
