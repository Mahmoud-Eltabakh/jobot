services:
  jobot:
    build:
      context: .
      dockerfile: Dockerfile
    image: jobot:latest
    pull_policy: build
    container_name: jobot-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - JOBOT_ENV=production
      - JOBOT_LOG_LEVEL=INFO
      - JOBOT_DATA_DIR=/app/data
      - JOBOT_AI_PROVIDER=ollama
      - JOBOT_OLLAMA_BASE_URL=http://ollama:11434
      - JOBOT_OLLAMA_MODEL=llama3.1:8b
      - JOBOT_OLLAMA_EMBED_MODEL=nomic-embed-text
    volumes:
      - jobot_data:/app/data
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - jobot_net

  ollama:
    image: ollama/ollama:latest
    container_name: jobot-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_KEEP_ALIVE=24h
    volumes:
      - ollama_storage:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:11434/api/version || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - jobot_net

volumes:
  jobot_data:
    driver: local
  ollama_storage:
    driver: local

networks:
  jobot_net:
    driver: bridge
