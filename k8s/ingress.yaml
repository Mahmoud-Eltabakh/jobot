apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jobot-ingress
  namespace: jobot
spec:
  rules:
    - host: jobot.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jobot-service
                port:
                  number: 8000
